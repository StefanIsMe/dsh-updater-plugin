name: Auto-close Pull Requests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close PR with comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const message = [
              "Thank you for your pull request — this repository is **issues-only** and does not accept PRs.",
              "",
              "Please open an Issue instead using the Bug report or Feature request template:",
              "- https://github.com/StefanIsMe/dsh-updater-plugin/issues/new/choose",
              "",
              "Maintainers triage issues and ship changes. If this PR contains a security fix, please open a bug report with the `security` label rather than a public PR.",
              "",
              "This PR will now be closed automatically."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed"
            });
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ["pr-auto-closed", "issues-only"]
              });
            } catch (e) {}
            try {
              await github.rest.issues.lock({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                lock_reason: "off_topic"
              });
            } catch (e) {}
